name: Release (develop → main)

# develop の内容を main へリリースするワークフロー（週次自動 + 手動実行可）。
# - develop → main の Release PR を作成 / 更新する
# - 同じ内容で Draft Release を作成する
# - 本文は OpenAI(gpt-4o) でコミットから生成する。OPENAI_API_KEY は必須
#   （未設定・API 失敗時は誤った内容を出さないようエラーで中断し、フォールバックしない）
#
# ここではマージも Publish もしない。Release PR のマージと Draft の Publish は
# autonomous-merge.yml が「作成から 24h のソーク + フル検証」を経て自動で行う
# （止めたい場合は Release PR に needs-human ラベル）。手動でマージ・Publish してもよい。
# 運用設計: docs/autonomous-operations.md
on:
  schedule:
    - cron: "0 21 * * 0" # 月曜 6:00 JST（マージは 24h ソーク後 ≒ 火曜朝）
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Draft Release のタグ名（空なら release-YYYY-MM-DD で自動採番）"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-develop-to-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Collect commits (main..develop)
        id: commits
        run: |
          git fetch origin main develop --quiet
          # リリース実行の判定は「全差分」で行う（依存更新やメンテのみでも main へ promote するため）。
          FULL_LOG=$(git log origin/main..origin/develop --no-merges --pretty=format:'- %s (%h)')
          if [ -z "$FULL_LOG" ]; then
            echo "develop は main より先行していません。リリース対象の差分がありません。"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          # リリースノートは利用ユーザー向けなので、利用者の挙動に出ない変更は除外する。
          # 除外: ドキュメント(docs/, *.md)・CI(.github/)・テスト(*.test.ts(x))・
          #       ビルド/ツール設定(packages/config/, *package.json, *tsconfig*.json, lockfile, turbo/vercel/eas)。
          # これらのパス「だけ」を触るコミットが対象外。コードと両方触るコミットは残る。
          USER_LOG=$(git log origin/main..origin/develop --no-merges --pretty=format:'- %s (%h)' \
            -- \
            ':!docs/' ':!*.md' \
            ':!.github/' \
            ':!*.test.ts' ':!*.test.tsx' \
            ':!packages/config/' \
            ':!*package.json' ':!*tsconfig*.json' \
            ':!pnpm-lock.yaml' ':!pnpm-workspace.yaml' \
            ':!turbo.json' ':!vercel.json' ':!eas.json')

          # 絞った結果が空＝利用者向けの変更が無いリリース（docs/CI/テスト/依存・設定のみ）。
          # この場合は除外コミットをノートに列挙せず、汎用のメンテナンス文を出す（後段で AI を呼ばない）。
          if [ -z "$USER_LOG" ]; then
            echo "maintenance=true" >> "$GITHUB_OUTPUT"
          else
            echo "maintenance=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "log<<__COMMIT_LOG__"
            echo "$USER_LOG"
            echo "__COMMIT_LOG__"
          } >> "$GITHUB_OUTPUT"

      - name: Stop if no changes
        if: steps.commits.outputs.has_changes != 'true'
        run: |
          echo "::notice::リリース対象の差分が無いため終了します。"

      - name: Generate release notes (AI summary or fallback)
        if: steps.commits.outputs.has_changes == 'true'
        id: notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMIT_LOG: ${{ steps.commits.outputs.log }}
          MAINTENANCE: ${{ steps.commits.outputs.maintenance }}
        run: |
          set -euo pipefail

          # 利用者向けの変更が無いリリース（docs/CI/テスト/依存・設定のみ）は、
          # 除外コミットを列挙せず汎用のメンテナンス文を出す。AI も OpenAI キーも不要。
          if [ "${MAINTENANCE:-false}" = "true" ]; then
            BODY=$(printf '%s\n\n%s\n' \
              '## メンテナンスリリース' \
              '利用者向けの機能変更はありません。内部改善・依存関係の更新・保守作業のみが含まれます。')
            {
              echo "body<<__RELEASE_BODY__"
              echo "$BODY"
              echo "__RELEASE_BODY__"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY が未設定です。リリースノート生成に必須のため中断します。Settings → Secrets に OPENAI_API_KEY を登録してください。"
            exit 1
          fi

          INSTRUCTIONS=$(printf '%s\n' \
            'あなたはリリースノートの編集者です。以下の Git コミット一覧から、日本語の Markdown リリースノートを作成してください。' \
            '要件:' \
            '- 冒頭に2〜3文のリリース概要を書く' \
            '- 「## 新機能」「## 改善・変更」「## 修正」の見出しで分類する（該当が無い見出しは省略）' \
            '- 各項目は利用者目線の自然な日本語にし、コミットの prefix(feat/fix 等) やハッシュは本文に出さない' \
            '- 内部的なリファクタや chore はまとめて簡潔にするか省略してよい' \
            '- 誇張せず、コミットから読み取れる事実のみを書く' \
            'コミット一覧:')
          PROMPT=$(printf '%s\n%s\n' "$INSTRUCTIONS" "$COMMIT_LOG")
          REQ=$(jq -n --arg content "$PROMPT" '{
            model: "gpt-4o",
            temperature: 0.3,
            messages: [
              { role: "system", content: "あなたは優れたソフトウェアのリリースノートを書く編集者です。" },
              { role: "user", content: $content }
            ]
          }')
          HTTP=$(curl -sS -w '\n%{http_code}' https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQ")
          CODE=$(printf '%s' "$HTTP" | tail -n1)
          RESP=$(printf '%s' "$HTTP" | sed '$d')
          if [ "$CODE" != "200" ]; then
            echo "::error::OpenAI API が HTTP $CODE を返しました。リリースノートを生成できないため中断します。"
            printf '%s\n' "$RESP" | head -c 2000
            exit 1
          fi
          SUMMARY=$(printf '%s' "$RESP" | jq -r '.choices[0].message.content // empty')
          if [ -z "$SUMMARY" ]; then
            echo "::error::OpenAI のレスポンスから要約を取得できませんでした。中断します。"
            exit 1
          fi
          BODY=$(printf '%s\n\n<details>\n<summary>変更コミット一覧</summary>\n\n%s\n</details>\n' "$SUMMARY" "$COMMIT_LOG")

          {
            echo "body<<__RELEASE_BODY__"
            echo "$BODY"
            echo "__RELEASE_BODY__"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update Release PR (develop → main)
        if: steps.commits.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          TITLE="Release: develop → main ($(date +%Y-%m-%d))"
          EXISTING=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "::notice::既存の Release PR #$EXISTING を更新しました。"
          else
            gh pr create --base main --head develop --title "$TITLE" --body "$BODY"
            echo "::notice::Release PR を作成しました。"
          fi

      - name: Create Draft Release
        if: steps.commits.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.notes.outputs.body }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG="release-$(date +%Y-%m-%d)"
          fi
          # 同名タグの Draft があれば作り直す（公開済みリリースは壊さないよう触らない）。
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q '^true$'; then
            gh release delete "$TAG" --yes
          fi
          # Draft はタグ未作成のはずだが、万一同名タグが残っていると後続の create で --target が
          # 無視され古いコミットに紐づくため、念のためタグ ref も掃除する（存在しなければ無視＝冪等）。
          gh api -X DELETE "repos/${REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
          # Draft なので target(main) のタグは未作成。「公開時」に main の当時の HEAD から
          # タグが作られるため、必ず develop→main の PR マージ後に公開すること。
          # マージ前に公開すると promote 前のコミットがタグ付けされる。
          WARNING='> ⚠️ このリリースは **develop→main の Release PR をマージした後に** Publish してください。マージ前に公開すると promote 前のコミットがタグ付けされます。'
          RELEASE_NOTES=$(printf '%s\n\n%s\n' "$WARNING" "$BODY")
          gh release create "$TAG" \
            --draft \
            --target main \
            --title "$TAG" \
            --notes "$RELEASE_NOTES"
          echo "::notice::Draft Release $TAG を作成しました（Publish は autonomous-merge が PR マージ後に自動実行。手動でも可）。"

      - name: 失敗を ops issue として起票
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="🚨 リリースワークフロー（Release PR 作成）が失敗"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create "ready-for-ai" -c "1D76DB" -d "AI エージェントが着手してよい issue" -f
          gh label create "source:ops"   -c "5319E7" -d "自動運用ワークフローが起票" -f
          existing=$(gh issue list --state open --label "source:ops" \
            --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          BODY="Release PR / Draft Release の作成が失敗しました（OPENAI_API_KEY 未設定・API エラーの可能性）。ログを確認し、修正してください。

          実行ログ: ${RUN_URL}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "再発しました: ${RUN_URL}"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "ready-for-ai" --label "source:ops"
          fi
