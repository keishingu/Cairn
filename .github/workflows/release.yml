name: Release (develop → main)

# develop の内容を main へリリースするための手動ワークフロー。
# - develop 側の DB Migrate（push 時に実行される migrate.yml）が成功しているか確認し、
#   失敗・未完了ならリリースPRを作らず中断する（dry-run は実行を伴わないチェックのため、
#   実際に preview DB へ適用できたかはこの確認でのみ担保される）
# - 本番DBへマイグレーションの dry-run を行い、失敗ならリリースPRを作らず中断する
#   （適用予定の一覧は PR 本文に載る。実適用はマージ時の migrate.yml が行う）
# - develop → main の Release PR を作成 / 更新する（マージは手動）
# - 同じ内容で Draft Release を作成する（タグ確定・公開は PR マージ後に手動）
# - 本文は OpenAI(gpt-4o) でコミットから生成する。OPENAI_API_KEY は必須
#   （未設定・API 失敗時は誤った内容を出さないようエラーで中断し、フォールバックしない）
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Draft Release のタグ名（空なら release-YYYY-MM-DD で自動採番）"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: release-develop-to-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # 本番DBへの dry-run（SUPABASE_DB_URL_PRODUCTION）を行うため production
    # Environment を参照する。workflow_dispatch は任意ブランチから実行できるため、
    # Deployment branch policy（main / develop のみ許可）で他ブランチからの
    # 実行に Secret が渡らないようにする。設定手順は docs/production-deployment.md
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Collect commits (main..develop)
        id: commits
        run: |
          git fetch origin main develop --quiet
          # リリース実行の判定は「全差分」で行う（依存更新やメンテのみでも main へ promote するため）。
          FULL_LOG=$(git log origin/main..origin/develop --no-merges --pretty=format:'- %s (%h)')
          if [ -z "$FULL_LOG" ]; then
            echo "develop は main より先行していません。リリース対象の差分がありません。"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          # リリースノートは利用ユーザー向けなので、利用者の挙動に出ない変更は除外する。
          # 除外: ドキュメント(docs/, *.md)・CI(.github/)・テスト(*.test.ts(x))・
          #       ビルド/ツール設定(packages/config/, *package.json, *tsconfig*.json, lockfile, turbo/vercel/eas)。
          # これらのパス「だけ」を触るコミットが対象外。コードと両方触るコミットは残る。
          USER_LOG=$(git log origin/main..origin/develop --no-merges --pretty=format:'- %s (%h)' \
            -- \
            ':!docs/' ':!*.md' \
            ':!.github/' \
            ':!*.test.ts' ':!*.test.tsx' \
            ':!packages/config/' \
            ':!*package.json' ':!*tsconfig*.json' \
            ':!pnpm-lock.yaml' ':!pnpm-workspace.yaml' \
            ':!turbo.json' ':!vercel.json' ':!eas.json')

          # 絞った結果が空＝利用者向けの変更が無いリリース（docs/CI/テスト/依存・設定のみ）。
          # この場合は除外コミットをノートに列挙せず、汎用のメンテナンス文を出す（後段で AI を呼ばない）。
          if [ -z "$USER_LOG" ]; then
            echo "maintenance=true" >> "$GITHUB_OUTPUT"
          else
            echo "maintenance=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "log<<__COMMIT_LOG__"
            echo "$USER_LOG"
            echo "__COMMIT_LOG__"
          } >> "$GITHUB_OUTPUT"

      - name: Stop if no changes
        if: steps.commits.outputs.has_changes != 'true'
        run: |
          echo "::notice::リリース対象の差分が無いため終了します。"

      # dry-run は SQL を実行しないため、実際に develop → preview へ適用できたかは
      # push 時の DB Migrate（migrate.yml）の結果でのみ分かる。ここが失敗・未完了のまま
      # リリースすると、本番で初めて同じ失敗が発覚することになるため事前に確認する。
      # event を push に絞らないのは、push 実行が失敗した際に運用者が
      # workflow_dispatch で手動リトライした場合も拾うため（一覧は作成日時の降順で
      # 返るため、head_sha が一致する最新の実行＝リトライがあればそちらを見る）。
      - name: Check develop DB Migrate status
        if: steps.commits.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          RUN_JSON=$(gh api "repos/${REPO}/actions/workflows/migrate.yml/runs?head_sha=${SHA}&branch=develop" --jq '.workflow_runs[0] // empty')
          if [ -z "$RUN_JSON" ]; then
            echo "::error::develop (${SHA}) に対する DB Migrate ワークフローの実行が見つかりません。push 直後で未起動の可能性があるため、数分待ってから再実行してください。"
            exit 1
          fi
          STATUS=$(printf '%s' "$RUN_JSON" | jq -r '.status')
          if [ "$STATUS" != "completed" ]; then
            echo "::error::develop の DB Migrate ワークフローがまだ実行中です（status=${STATUS}）。完了を待ってから再実行してください。"
            exit 1
          fi
          CONCLUSION=$(printf '%s' "$RUN_JSON" | jq -r '.conclusion')
          if [ "$CONCLUSION" != "success" ]; then
            HTML_URL=$(printf '%s' "$RUN_JSON" | jq -r '.html_url')
            echo "::error::develop への DB Migrate が失敗しています（conclusion=${CONCLUSION}）。preview DB への適用に失敗した状態のままリリースすると本番でも同じ失敗が起きるため中断します。${HTML_URL} を確認して修正してください。"
            exit 1
          fi
          echo "::notice::develop の DB Migrate 実行（${SHA}）は成功しています。"

      - name: Setup Supabase CLI
        if: steps.commits.outputs.has_changes == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # 本番DBへ dry-run し、マージ時に適用されるマイグレーションを事前に確認する。
      # 接続不可・履歴不整合ならリリースPRを作らずここで中断する（マージ後に
      # 初めて migration 失敗が発覚し、新コード×旧スキーマで本番エラーになるのを防ぐ）
      - name: Migration dry-run (production)
        if: steps.commits.outputs.has_changes == 'true'
        id: migrations
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_PRODUCTION }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL_PRODUCTION が未設定です。本番DBへの dry-run に必須のため中断します。Settings → Secrets に Session Pooler の接続文字列を登録してください。"
            exit 1
          fi
          set +e
          OUTPUT=$(supabase db push --include-all --dry-run --db-url "$DB_URL" 2>&1)
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::本番DBへの migration dry-run に失敗しました。接続設定またはマイグレーション履歴の不整合を解消してから再実行してください。"
            exit "$STATUS"
          fi

          # dry-run 出力から適用予定のマイグレーションファイル名を抽出する
          PENDING=$(printf '%s\n' "$OUTPUT" | grep -oE '[0-9]+_[A-Za-z0-9_-]+\.sql' | sort -u || true)
          if [ -n "$PENDING" ]; then
            LIST=$(printf '%s\n' "$PENDING" | sed 's/^/- `/; s/$/`/')
            SECTION=$(printf '%s\n\n%s\n\n%s\n' \
              '## DBマイグレーション' \
              "マージ時に [DB Migrate ワークフロー](https://github.com/${REPO}/actions/workflows/migrate.yml) が本番DBへ以下を自動適用します。適用が失敗した場合は Actions の通知を確認し、修正 or 手動適用すること。" \
              "$LIST")
          else
            SECTION=$(printf '%s\n\n%s\n' \
              '## DBマイグレーション' \
              '適用予定のマイグレーションはありません（スキーマ変更を含まないリリース）。')
          fi
          {
            echo "section<<__MIGRATIONS__"
            echo "$SECTION"
            echo "__MIGRATIONS__"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes (AI summary or fallback)
        if: steps.commits.outputs.has_changes == 'true'
        id: notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMIT_LOG: ${{ steps.commits.outputs.log }}
          MAINTENANCE: ${{ steps.commits.outputs.maintenance }}
        run: |
          set -euo pipefail

          # 利用者向けの変更が無いリリース（docs/CI/テスト/依存・設定のみ）は、
          # 除外コミットを列挙せず汎用のメンテナンス文を出す。AI も OpenAI キーも不要。
          if [ "${MAINTENANCE:-false}" = "true" ]; then
            BODY=$(printf '%s\n\n%s\n' \
              '## メンテナンスリリース' \
              '利用者向けの機能変更はありません。内部改善・依存関係の更新・保守作業のみが含まれます。')
            {
              echo "body<<__RELEASE_BODY__"
              echo "$BODY"
              echo "__RELEASE_BODY__"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY が未設定です。リリースノート生成に必須のため中断します。Settings → Secrets に OPENAI_API_KEY を登録してください。"
            exit 1
          fi

          INSTRUCTIONS=$(printf '%s\n' \
            'あなたはリリースノートの編集者です。以下の Git コミット一覧から、日本語の Markdown リリースノートを作成してください。' \
            '要件:' \
            '- 冒頭に2〜3文のリリース概要を書く' \
            '- 「## 新機能」「## 改善・変更」「## 修正」の見出しで分類する（該当が無い見出しは省略）' \
            '- 各項目は利用者目線の自然な日本語にし、コミットの prefix(feat/fix 等) やハッシュは本文に出さない' \
            '- 内部的なリファクタや chore はまとめて簡潔にするか省略してよい' \
            '- 誇張せず、コミットから読み取れる事実のみを書く' \
            'コミット一覧:')
          PROMPT=$(printf '%s\n%s\n' "$INSTRUCTIONS" "$COMMIT_LOG")
          REQ=$(jq -n --arg content "$PROMPT" '{
            model: "gpt-4o",
            temperature: 0.3,
            messages: [
              { role: "system", content: "あなたは優れたソフトウェアのリリースノートを書く編集者です。" },
              { role: "user", content: $content }
            ]
          }')
          HTTP=$(curl -sS -w '\n%{http_code}' https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQ")
          CODE=$(printf '%s' "$HTTP" | tail -n1)
          RESP=$(printf '%s' "$HTTP" | sed '$d')
          if [ "$CODE" != "200" ]; then
            echo "::error::OpenAI API が HTTP $CODE を返しました。リリースノートを生成できないため中断します。"
            printf '%s\n' "$RESP" | head -c 2000
            exit 1
          fi
          SUMMARY=$(printf '%s' "$RESP" | jq -r '.choices[0].message.content // empty')
          if [ -z "$SUMMARY" ]; then
            echo "::error::OpenAI のレスポンスから要約を取得できませんでした。中断します。"
            exit 1
          fi
          BODY=$(printf '%s\n\n<details>\n<summary>変更コミット一覧</summary>\n\n%s\n</details>\n' "$SUMMARY" "$COMMIT_LOG")

          {
            echo "body<<__RELEASE_BODY__"
            echo "$BODY"
            echo "__RELEASE_BODY__"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update Release PR (develop → main)
        if: steps.commits.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.notes.outputs.body }}
          MIGRATIONS_SECTION: ${{ steps.migrations.outputs.section }}
        run: |
          set -euo pipefail
          # マイグレーション情報は運用者向けなので PR 本文にのみ載せる（Draft Release には載せない）
          BODY=$(printf '%s\n\n%s\n' "$BODY" "$MIGRATIONS_SECTION")
          TITLE="Release: develop → main ($(date +%Y-%m-%d))"
          EXISTING=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "::notice::既存の Release PR #$EXISTING を更新しました。"
          else
            gh pr create --base main --head develop --title "$TITLE" --body "$BODY"
            echo "::notice::Release PR を作成しました。"
          fi

      - name: Create Draft Release
        if: steps.commits.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.notes.outputs.body }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG="release-$(date +%Y-%m-%d)"
          fi
          # 同名タグの Draft があれば作り直す（公開済みリリースは壊さないよう触らない）。
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q '^true$'; then
            gh release delete "$TAG" --yes
          fi
          # Draft はタグ未作成のはずだが、万一同名タグが残っていると後続の create で --target が
          # 無視され古いコミットに紐づくため、念のためタグ ref も掃除する（存在しなければ無視＝冪等）。
          gh api -X DELETE "repos/${REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
          # Draft なので target(main) のタグは未作成。「公開時」に main の当時の HEAD から
          # タグが作られるため、必ず develop→main の PR マージ後に公開すること。
          # マージ前に公開すると promote 前のコミットがタグ付けされる。
          WARNING='> ⚠️ このリリースは **develop→main の Release PR をマージした後に** Publish してください。マージ前に公開すると promote 前のコミットがタグ付けされます。'
          RELEASE_NOTES=$(printf '%s\n\n%s\n' "$WARNING" "$BODY")
          gh release create "$TAG" \
            --draft \
            --target main \
            --title "$TAG" \
            --notes "$RELEASE_NOTES"
          echo "::notice::Draft Release $TAG を作成しました（公開は PR マージ後に手動で）。"
