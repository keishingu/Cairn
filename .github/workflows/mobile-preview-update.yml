name: Mobile Preview Update

# develop へ merge されたモバイルの JS 変更を、Internal Distribution の preview
# チャンネルへ EAS Update（OTA）で配信する。届くのは runtimeVersion が一致する
# preview ビルドだけ。ネイティブモジュールを追加・更新したときは runtimeVersion を
# 上げて preview ビルドを作り直す。
#
# paths で絞らず develop への push ごとに配信する。大きな merge で変更ファイルが
# 300 件を超えても起動漏れを防ぐため、Web だけの変更でも同じ bundle を配信する。
on:
  push:
    branches: [develop]
  workflow_dispatch: {}

# 実行中の配信は取り消さず、待機中は新しい push に置き換える。開始時点の develop
# 先頭を配信し、古い commit で preview を巻き戻さない。
concurrency:
  group: mobile-preview-develop-update
  cancel-in-progress: false

jobs:
  update:
    name: Publish Mobile EAS Update to preview
    runs-on: ubuntu-latest
    environment: Preview
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: read

    steps:
      - name: Check required settings
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "GitHub Actions secret EXPO_TOKEN is required in the Preview environment."
            exit 1
          fi

      - name: Checkout latest develop
        uses: actions/checkout@v5
        with:
          ref: develop
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '^22.23.4'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.10.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish EAS Update
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_CAIRN_DEPLOYMENT_ENV: preview
        run: |
          eas update \
            --channel preview \
            --environment preview \
            --message "develop $(git rev-parse --short HEAD): $(git log -1 --format=%s)" \
            --non-interactive
